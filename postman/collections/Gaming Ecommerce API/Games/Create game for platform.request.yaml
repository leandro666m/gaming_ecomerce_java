      const baseUrl = pm.collectionVariables.get("baseUrl") || pm.environment.get("baseUrl");
      let completed = 0;
      let errors = [];

      games.forEach((game, index) => {
        const url = `${baseUrl}/platforms/${game.platformId}/games`;
        pm.sendRequest(
          {
            url: url,
            method: "POST",
            header: { "Content-Type": "application/json" },
            body: { mode: "raw", raw: JSON.stringify(game) }
          },
          (err, res) => {
            completed++;
            if (err) {
              errors.push(`[${game.title}] Error: ${err}`);
            } else if (res.code >= 400) {
              errors.push(`[${game.title}] HTTP ${res.code}: ${res.text()}`);
            } else {
              console.log(`✅ [${index + 1}/${games.length}] ${game.title} → ${res.code}`);
            }
            if (completed === games.length) {
              if (errors.length > 0) {
                console.warn("⚠️ Errores:\n" + errors.join("\n"));
              } else {
                console.log("🎮 Todos los juegos insertados correctamente.");
              }
            }
          }
        );
